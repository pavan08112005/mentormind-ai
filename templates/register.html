<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>MentorMind AI - Register</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>

<div class="form-container">

    <div style="text-align:center; margin-bottom:30px;">

        <h1>MentorMind AI</h1>

        <p>
            Create your account and start preparing
            for placements.
        </p>

    </div>

    {% with messages = get_flashed_messages() %}

        {% if messages %}

            {% for message in messages %}

                <div class="flash">
                    {{ message }}
                </div>

            {% endfor %}

        {% endif %}

    {% endwith %}

    <h2>Create Account</h2>

    <form method="POST">

        <label for="name">
            Full Name
        </label>

        <input
            type="text"
            id="name"
            name="name"
            placeholder="Enter your name"
            required
        >

        <label for="email">
            Email
        </label>

        <input
            type="email"
            id="email"
            name="email"
            placeholder="Enter your email"
            required
        >

        <label for="password">
            Password
        </label>

        <input
            type="password"
            id="password"
            name="password"
            placeholder="Create a password"
            required
        >
        <label for="confirm_password">Confirm Password</label>

<input
    type="password"
    id="confirm_password"
    name="confirm_password"
    placeholder="Confirm your password"
    required
>
        <button type="submit">
            Register
        </button>

    </form>

    <p style="margin-top:20px; text-align:center;">

        Already have an account?

        <a href="{{ url_for('login') }}">
            Login
        </a>

    </p>

</div>

</body>

</html>
